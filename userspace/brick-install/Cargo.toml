[package]
name = "brick-install"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
crc32fast = "1.5"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
zstd = { version = "0.13", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
