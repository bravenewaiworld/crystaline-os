# Buildroot's mdev.conf (package/busybox/mdev.conf) with the SD card's rule added.
# null may already exist; therefore ownership has to be changed with command
null		root:root 666 @chmod 666 $MDEV
zero		root:root 666
full		root:root 666
random		root:root 444
urandom		root:root 444
hwrandom	root:root 444
grsec		root:root 660

kmem		root:root 640
mem		root:root 640
port		root:root 640
# console may already exist; therefore ownership has to be changed with command
console		root:tty 600 @chmod 600 $MDEV
ptmx		root:tty 666
pty.*		root:tty 660

# Typical devices
tty		root:tty 666
tty[0-9]*	root:tty 660
vcsa*[0-9]*	root:tty 660
ttyS[0-9]*	root:root 660
ttyUSB[0-9]*	root:root 660

# alsa sound devices
snd/pcm.*	root:audio 660
snd/control.*	root:audio 660
snd/midi.*	root:audio 660
snd/seq		root:audio 660
snd/timer	root:audio 660

# input stuff
input/event[0-9]+	root:root 640
input/mice		root:root 640
input/mouse[0-9]	root:root 640
input/ts[0-9]		root:root 600

# The SD card's disk appearing, changing or going ("*": run on add, remove and change): mount-card
# makes the data partition's mount match the card in the slot. It reads the partitions itself, so
# their own events aren't needed (rules match the whole name: mmcblk1p1 doesn't). The eMMC's disk
# matches too; that run only finds the card as it was, so it is harmless.
mmcblk[0-9]+	root:root 660 */usr/libexec/brick/mount-card event

# load modules
$MODALIAS=.*	root:root 660 @modprobe "$MODALIAS"
